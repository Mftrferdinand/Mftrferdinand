<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Mahesa F. Ferdinand — Building Zeline</title>
  <desc id="description">A minimal black-and-white banner for Mahesa F. Ferdinand's GitHub profile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#background)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="284" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <g transform="translate(72 78)">
    <rect x="0" y="0" width="42" height="42" rx="6" fill="#f4f4f5"/>
    <path d="M11 10h21L12 32h21" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
    <text x="0" y="86" fill="#f4f4f5" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="3">MAHESA F. FERDINAND</text>
    <text x="2" y="116" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="2.8">LEAD AT ZEROLINEAR · BUILDING ZELINE</text>
    <line x1="2" y1="148" x2="478" y2="148" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="2" y="181" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="16">Open-source agentic AI systems, built for developers.</text>
  </g>

  <g transform="translate(840 66)" fill="none" stroke="#f4f4f5">
    <circle cx="136" cy="94" r="94" stroke-opacity="0.06" stroke-width="18" filter="url(#softGlow)"/>
    <circle cx="136" cy="94" r="78" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="136" cy="94" r="54" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M79 58h112L83 130h112" stroke-width="10" stroke-linejoin="miter"/>
    <circle cx="79" cy="58" r="4" fill="#f4f4f5" stroke="none"/>
    <circle cx="195" cy="130" r="4" fill="#f4f4f5" stroke="none"/>
  </g>

  <g fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.7">
    <text x="74" y="272">AGENTIC AI</text>
    <text x="217" y="272">/</text>
    <text x="241" y="272">OPEN SOURCE</text>
    <text x="407" y="272">/</text>
    <text x="431" y="272">SELF-HOSTED</text>
  </g>
</svg>
